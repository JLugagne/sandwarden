name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tags: gtk3,production
          - runner: macos-14
            goos: darwin
            goarch: arm64
            tags: production
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install GTK/WebKit build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev
      - name: Build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build binary
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'unstable' }}"
          go build -tags "${{ matrix.tags }}" -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o sandwarden .
      - name: Package
        run: |
          ARCHIVE="sandwarden_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARCHIVE" sandwarden README.md
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sandwarden_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            sandwarden_*.tar.gz
            sandwarden_*.sha256
          if-no-files-found: error

  publish-stable:
    name: publish stable release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Merge checksums
        run: cat dist/*.sha256 | sort -k2 > dist/checksums.txt && rm dist/*.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$TAG" \
              dist/*.tar.gz dist/checksums.txt \
              --title "$TAG" \
              --generate-notes
          fi

  publish-unstable:
    name: publish unstable pre-release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Merge checksums
        run: cat dist/*.sha256 | sort -k2 > dist/checksums.txt && rm dist/*.sha256
      - name: Publish unstable
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete unstable --yes --cleanup-tag 2>/dev/null || true
          gh release create unstable \
            dist/*.tar.gz dist/checksums.txt \
            --title "Unstable (main)" \
            --target main \
            --prerelease \
            --notes "Rolling build from \`main\` (${SHA}).

          Install with:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/JLugagne/sandwarden/main/install-unstable.sh | bash
          \`\`\`"
