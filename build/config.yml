version: '3'

# Development mode for `wails3 dev` (`make dev`).
#
# The Vite dev server runs in the background and the Go app is restarted on
# every *.go change. FRONTEND_DEVSERVER_URL and WAILS_VITE_PORT are set by the
# wails3 CLI, so the app loads HMR assets instead of the embedded dist.
dev_mode:
  root_path: .
  log_level: warn
  debounce: 500
  ignore:
    dir:
      - .git
      - bin
      - data
      - web
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: npm --prefix web run dev
      type: background
    - cmd: go build -tags gtk3 -o bin/sbx-ui-dev .
      type: blocking
    - cmd: ./bin/sbx-ui-dev
      type: primary
